<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites - Movie Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    body {
      padding-top: 60px;
      background-color: #f8f9fa;
      font-family: 'Arial', sans-serif;
    }

    .card {
      transition: transform 0.3s ease;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }

    .card-img-top {
      height: 300px;
      object-fit: cover;
    }

    .card-body {
      padding: 1.25rem;
    }

    .card-footer {
      padding: 0.75rem 1.25rem;
      background-color: rgba(0, 0, 0, 0.03);
      border-top: 1px solid rgba(0, 0, 0, 0.125);
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #333;
      border-bottom: 2px solid #007bff;
      padding-bottom: 0.5rem;
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 50px 0;
      color: #6c757d;
    }

    /* Login prompt styling */
    .login-prompt {
      background-color: #fff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Demo mode banner */
    .demo-banner {
      background-color: #ffe8cc;
      color: #995400;
      text-align: center;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 4px;
    }

    /* Auth-specific display classes */
    .auth-required {
      display: none;
    }

    .auth-guest {
      display: none;
    }

    .auth-user {
      display: none;
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="fas fa-film me-2"></i>Movie Recommender
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
        aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/favorites"><i class="fas fa-heart me-1"></i>Favorites</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/watchlist"><i class="fas fa-list me-1"></i>Watchlist</a>
          </li>
        </ul>
        <div class="d-flex">
          <!-- Guest navigation -->
          <div class="auth-guest">
            <a href="/login" class="btn btn-outline-light me-2">Log In</a>
            <a href="/signup" class="btn btn-primary">Sign Up</a>
          </div>

          <!-- User navigation -->
          <div class="auth-user">
            <div class="dropdown">
              <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown"
                data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-user me-1"></i>
                <span id="username-display">User</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                <li><a class="dropdown-item" href="/profile"><i class="fas fa-user-circle me-1"></i>Profile</a></li>
                <li><a class="dropdown-item" href="/settings"><i class="fas fa-cog me-1"></i>Settings</a></li>
                <li>
                  <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="#" id="logout-btn"><i class="fas fa-sign-out-alt me-1"></i>Log
                    Out</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container mt-5">
    <h2><i class="fas fa-heart me-2"></i>My Favorites</h2>

    <!-- Auth required content -->
    <div class="auth-required">
      <div id="favorites-container" class="row">
        <!-- Favorite movies will be dynamically added here -->
        <div class="col-12 text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading your favorites...</p>
        </div>
      </div>
    </div>

    <!-- Guest content -->
    <div class="auth-guest">
      <div class="login-prompt">
        <i class="fas fa-user-lock fa-4x mb-4 text-primary"></i>
        <h3>Please Log In</h3>
        <p class="mb-4">You need to be logged in to view and manage your favorites.</p>
        <a href="/login" class="btn btn-primary me-2">Log In</a>
        <a href="/signup" class="btn btn-outline-primary">Sign Up</a>
        <hr class="my-4">
        <button id="demo-mode" class="btn btn-link">View Demo Mode</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/auth-frontend.js"></script>
  <script>
    // Sample data for demo mode
    const SAMPLE_FAVORITES = [
      {
        id: 1,
        title: "The Shawshank Redemption",
        year: "1994",
        poster: "https://via.placeholder.com/300x450?text=Shawshank+Redemption",
        genres: "Drama"
      },
      {
        id: 2,
        title: "The Godfather",
        year: "1972",
        poster: "https://via.placeholder.com/300x450?text=The+Godfather",
        genres: "Crime, Drama"
      }
    ];

    // Show demo mode
    function showDemoMode() {
      // Clear auth classes first
      document.querySelectorAll('.auth-required').forEach(el => {
        el.style.display = 'none';
      });
      document.querySelectorAll('.auth-guest').forEach(el => {
        el.style.display = 'none';
      });

      // Show demo content
      const container = document.querySelector('.container');

      // Create demo container if it doesn't exist
      let demoContainer = document.getElementById('demo-container');
      if (!demoContainer) {
        demoContainer = document.createElement('div');
        demoContainer.id = 'demo-container';
        container.appendChild(demoContainer);
      }

      // Add demo banner and content
      demoContainer.innerHTML = `
        <div class="demo-banner mb-3">
          <i class="fas fa-info-circle me-2"></i>
          <strong>Demo Mode:</strong> Showing sample data. <a href="/login">Log in</a> to see your actual favorites.
        </div>
        <div id="demo-favorites" class="row">
        </div>
      `;

      // Populate with sample favorites
      const demoFavoritesContainer = document.getElementById('demo-favorites');

      SAMPLE_FAVORITES.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.className = 'col-md-4 col-lg-3 col-sm-6';
        movieCard.innerHTML = `
          <div class="card h-100">
            <img src="${movie.poster || 'https://via.placeholder.com/300x450?text=' + encodeURIComponent(movie.title)}" 
                class="card-img-top" 
                alt="${movie.title}">
            <div class="card-body">
              <h5 class="card-title">${movie.title}</h5>
              <p class="card-text text-muted">${movie.year}</p>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
              <small class="text-muted">${movie.genres || 'Unknown Genre'}</small>
              <button class="btn btn-sm btn-outline-danger remove-btn" disabled>
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;

        demoFavoritesContainer.appendChild(movieCard);
      });
    }

    // Show error message
    function showError(message) {
      const container = document.getElementById('favorites-container');
      container.innerHTML = `
        <div class="col-12">
          <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>${message}
          </div>
          <button id="retry-button" class="btn btn-primary">Retry</button>
          <button id="demo-mode-btn" class="btn btn-outline-secondary ms-2">View Demo Mode</button>
        </div>
      `;

      // Add event listeners
      document.getElementById('retry-button').addEventListener('click', loadFavorites);
      document.getElementById('demo-mode-btn').addEventListener('click', showDemoMode);
    }

    // Load favorites
    function loadFavorites() {
      // Get favorites container
      const favoritesContainer = document.getElementById('favorites-container');

      // Show loading
      favoritesContainer.innerHTML = `
        <div class="col-12 text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading your favorites...</p>
        </div>
      `;

      // Use the getFavorites function from auth-frontend.js
      getFavorites()
        .then(favorites => {
          displayFavorites(favorites);
        })
        .catch(error => {
          console.error('Error loading favorites:', error);
          showError(error.message || 'Failed to load favorites');
        });
    }

    // Display favorites
    function displayFavorites(favorites) {
      const favoritesContainer = document.getElementById('favorites-container');

      if (!favorites || favorites.length === 0) {
        favoritesContainer.innerHTML = `
          <div class="col-12 empty-state">
            <i class="fas fa-heart fa-4x mb-3"></i>
            <h3>Your favorites list is empty</h3>
            <p>Start adding movies you love!</p>
            <a href="/" class="btn btn-primary mt-3">Browse Movies</a>
          </div>
        `;
        return;
      }

      // Clear existing content
      favoritesContainer.innerHTML = '';

      // Create cards for each favorite movie
      favorites.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.className = 'col-md-4 col-lg-3 col-sm-6';
        movieCard.innerHTML = `
          <div class="card h-100">
            <img src="${movie.poster || 'https://via.placeholder.com/300x450?text=' + encodeURIComponent(movie.title)}" 
                class="card-img-top" 
                alt="${movie.title}">
            <div class="card-body">
              <h5 class="card-title">${movie.title}</h5>
              <p class="card-text text-muted">${movie.year || ''}</p>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
              <small class="text-muted">${movie.genres || 'Unknown Genre'}</small>
              <button class="btn btn-sm btn-outline-danger remove-favorite-btn" 
                      data-movie-id="${movie.id}">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;

        favoritesContainer.appendChild(movieCard);
      });

      // Add event listeners to remove buttons
      document.querySelectorAll('.remove-favorite-btn').forEach(button => {
        button.addEventListener('click', function () {
          const movieId = this.getAttribute('data-movie-id');
          removeFromFavorites(movieId)
            .then(() => {
              // Reload favorites after successful removal
              loadFavorites();
            })
            .catch(error => {
              console.error('Error removing from favorites:', error);
            });
        });
      });
    }

    // Initialize when the page loads
    document.addEventListener('DOMContentLoaded', function () {
      // Set up demo mode button
      const demoButton = document.getElementById('demo-mode');
      if (demoButton) {
        demoButton.addEventListener('click', showDemoMode);
      }

      // If user is logged in, load favorites
      if (isLoggedIn()) {
        loadFavorites();
      }
    });
  </script>
</body>

</html>
