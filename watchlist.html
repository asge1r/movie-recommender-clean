<head>
  <meta charset="UTF-8">

  <title>My Watchlist - Movie Recommender</title>

  <!-- Error suppression script - MUST BE FIRST -->
  <script>
    // More aggressive error suppression for third-party scripts
    (function () {
      // Only apply in development
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        // Store original console methods
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        const originalConsoleLog = console.log;

        // Create a filter function
        function shouldFilter(args) {
          if (!args || args.length === 0) return false;

          // Convert all arguments to string for checking
          let text = '';
          try {
            text = Array.from(args).join(' ').toLowerCase();
          } catch (e) {
            // In case arguments can't be converted to string
            return false;
          }

          // Check for specific patterns
          return text.includes('amplitude') ||
            text.includes('sentry') ||
            text.includes('message port closed') ||
            text.includes('blocked by client') ||
            text.includes('err_blocked_by_client') ||
            text.includes('contentscript.bundle.js');
        }

        // Override console methods
        console.error = function () {
          if (shouldFilter(arguments)) return;
          originalConsoleError.apply(console, arguments);
        };

        console.warn = function () {
          if (shouldFilter(arguments)) return;
          originalConsoleWarn.apply(console, arguments);
        };

        console.log = function () {
          if (shouldFilter(arguments)) return;
          originalConsoleLog.apply(console, arguments);
        };

        // Intercept XMLHttpRequest
        const originalXHROpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function () {
          const url = arguments[1];
          if (typeof url === 'string' &&
            (url.includes('amplitude') || url.includes('sentry.io'))) {
            // Pretend the request is happening but don't actually send it
            this.abort = function () { };
            this.send = function () {
              this.readyState = 4;
              this.status = 200;
              this.responseText = '{"success":true}';
              if (typeof this.onreadystatechange === 'function') {
                this.onreadystatechange();
              }
            };
            return;
          }
          originalXHROpen.apply(this, arguments);
        };

        // Suppress fetch errors for analytics services
        if (window.fetch) {
          const originalFetch = window.fetch;
          window.fetch = function () {
            // Check if this is an analytics URL
            const url = arguments[0];
            if (typeof url === 'string' &&
              (url.includes('amplitude') || url.includes('sentry.io'))) {
              // Return a resolved promise with empty response
              return Promise.resolve(new Response(JSON.stringify({ success: true }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }

            return originalFetch.apply(window, arguments)
              .catch(error => {
                // Catch network errors for analytics services
                if (typeof url === 'string' &&
                  (url.includes('amplitude') || url.includes('sentry.io'))) {
                  return new Response(JSON.stringify({ success: true }), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                  });
                }
                throw error;
              });
          };
        }

        // Intercept and stop error events from certain sources
        window.addEventListener('error', function (e) {
          if (e && e.target) {
            // Check if this error is from a script or resource
            const src = e.target.src || e.target.href || '';

            if (src.includes('amplitude') ||
              src.includes('sentry.io') ||
              src.includes('contentScript.bundle.js')) {
              e.preventDefault();
              e.stopPropagation();
              return true; // Prevent default error handling
            }
          }

          // Also check error message
          if (e && e.message && typeof e.message === 'string') {
            const msg = e.message.toLowerCase();
            if (msg.includes('amplitude') ||
              msg.includes('sentry') ||
              msg.includes('message port closed')) {
              e.preventDefault();
              e.stopPropagation();
              return true;
            }
          }

          return false; // Let other errors propagate
        }, true);

        // Also handle unhandled promise rejections
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason) {
            const reason = e.reason.toString ? e.reason.toString() : '';
            if (reason.includes('amplitude') ||
              reason.includes('sentry') ||
              reason.includes('message port closed') ||
              reason.includes('contentScript')) {
              e.preventDefault();
              return true;
            }
          }
          return false;
        }, true);
      }
    })();
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

      margin-bottom: 20px;

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }

    .card-img-top {
      height: 300px;
      object-fit: cover;
    }

    .card-body {
      padding: 1.25rem;
    }

    .card-footer {
      padding: 0.75rem 1.25rem;
      background-color: rgba(0, 0, 0, 0.03);
      border-top: 1px solid rgba(0, 0, 0, 0.125);
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }

    h2 {
      margin-bottom: 1.5rem;

      border-bottom: 2px solid #007bff;
      padding-bottom: 0.5rem;
      display: inline-block;

    .empty-state {
      text-align: center;
      padding: 50px 0;
      color: #6c757d;
    }

    /* Login prompt styling */
    .login-prompt {
      background-color: #fff;
      border-radius: 8px;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

    /* Demo mode banner */

    /* Auth-specific display classes */
    .auth-required {
      display: none;

      display: none;
    }

      display: none;

<body>

        <div class="d-flex">

                <li><a class="dropdown-item" href="/settings"><i class="fas fa-cog me-1"></i>Settings</a></li>

                  <hr class="dropdown-divider">

                    Out</a></li>
              </ul>

  <!-- Page Content -->
  <div class="container mt-5">
    <h2><i class="fas fa-list me-2"></i>My Watchlist</h2>

    <!-- Auth required content -->
    <div class="auth-required">
      <div id="watchlist-container" class="row">
        <!-- Watchlist movies will be dynamically added here -->
        <div class="col-12 text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading your watchlist...</p>
        </div>
      </div>
    </div>

    <!-- Guest content -->
    <div class="auth-guest">
      <div class="login-prompt">
        <i class="fas fa-user-lock fa-4x mb-4 text-primary"></i>
        <h3>Please Log In</h3>
        <p class="mb-4">You need to be logged in to view and manage your watchlist.</p>
        <a href="/login" class="btn btn-primary me-2">Log In</a>
        <a href="/signup" class="btn btn-outline-primary">Sign Up</a>
        <hr class="my-4">
        <button id="demo-mode" class="btn btn-link">View Demo Mode</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/auth-frontend.js"></script>
  <script>
    // Format genres function to handle CSV format
    function formatGenres(genres) {
      if (!genres) return 'Uncategorized';

      // Handle the semicolon-separated format from your CSV
      if (typeof genres === 'string') {
        // Remove any trailing semicolons and spaces
        const cleaned = genres.replace(/;\s*$/, '');
        // Replace semicolons with commas for better readability
        return cleaned.replace(/;\s*/g, ', ');
      }

      // If it's already an array, join with commas
      if (Array.isArray(genres)) {
        return genres.join(', ');
      }

      return String(genres);
    }

    // Sample data for demo mode
    const SAMPLE_WATCHLIST = [
      {
        id: 1,
        title: "Dune",
        year: "2021",
        poster: "https://via.placeholder.com/300x450?text=Dune",
        genres: "Sci-Fi; Adventure; "
      },
      {
        id: 2,
        title: "No Time to Die",
        year: "2021",
        poster: "https://via.placeholder.com/300x450?text=No+Time+to+Die",
        genres: "Action; Thriller; "
      }
    ];

    // Show demo mode
    function showDemoMode() {
      // Clear auth classes first
      document.querySelectorAll('.auth-required').forEach(el => {
        el.style.display = 'none';
      });
      document.querySelectorAll('.auth-guest').forEach(el => {
        el.style.display = 'none';
      });

      // Show demo content
      const container = document.querySelector('.container');

      // Create demo container if it doesn't exist
      let demoContainer = document.getElementById('demo-container');
      if (!demoContainer) {
        demoContainer = document.createElement('div');
        demoContainer.id = 'demo-container';
        container.appendChild(demoContainer);
      }

      // Add demo banner and content
      demoContainer.innerHTML = `
        <div class="demo-banner mb-3">
          <i class="fas fa-info-circle me-2"></i>
          <strong>Demo Mode:</strong> Showing sample data. <a href="/login">Log in</a> to see your actual watchlist.
        </div>
        <div id="demo-watchlist" class="row">
        </div>
      `;

      // Populate with sample watchlist
      const demoWatchlistContainer = document.getElementById('demo-watchlist');

      SAMPLE_WATCHLIST.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.className = 'col-md-4 col-lg-3 col-sm-6';
        movieCard.innerHTML = `
          <div class="card h-100">
            <img src="${movie.poster || 'https://via.placeholder.com/300x450?text=' + encodeURIComponent(movie.title)}" 
                class="card-img-top" 
                alt="${movie.title}">
            <div class="card-body">
              <h5 class="card-title">${movie.title}</h5>
              <p class="card-text text-muted">${movie.year}</p>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
              <small class="text-muted">${formatGenres(movie.genres)}</small>
              <button class="btn btn-sm btn-outline-danger remove-btn" disabled>
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;

        demoWatchlistContainer.appendChild(movieCard);
      });
    }

    // Show error message
    function showError(message) {
      const container = document.getElementById('watchlist-container');
      container.innerHTML = `
        <div class="col-12">
          <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>${message}
          </div>
          <button id="retry-button" class="btn btn-primary">Retry</button>
          <button id="demo-mode-btn" class="btn btn-outline-secondary ms-2">View Demo Mode</button>
        </div>
      `;

      // Add event listeners
      document.getElementById('retry-button').addEventListener('click', loadWatchlist);
      document.getElementById('demo-mode-btn').addEventListener('click', showDemoMode);
    }

    // Load watchlist
    function loadWatchlist() {
      // Get watchlist container
      const watchlistContainer = document.getElementById('watchlist-container');

      // Show loading
      watchlistContainer.innerHTML = `
        <div class="col-12 text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading your watchlist...</p>
        </div>
      `;

      try {
        // Use the getWatchlist function from auth-frontend.js
        getWatchlist()
          .then(watchlist => {
            displayWatchlist(watchlist);
          })
          .catch(error => {
            console.error('Error loading watchlist:', error);
            showError(error.message || 'Failed to load watchlist');
          });
      } catch (error) {
        console.error('Exception loading watchlist:', error);
        showError('An unexpected error occurred. Please try again.');
      }
    }

    // Display watchlist
    function displayWatchlist(watchlist) {
      const watchlistContainer = document.getElementById('watchlist-container');

      if (!watchlist || watchlist.length === 0) {
        watchlistContainer.innerHTML = `
          <div class="col-12 empty-state">
            <i class="fas fa-list-alt fa-4x mb-3"></i>
            <h3>Your watchlist is empty</h3>
            <p>Start adding movies you want to watch!</p>
            <a href="/" class="btn btn-primary mt-3">Browse Movies</a>
          </div>
        `;
        return;
      }

      // Clear existing content
      watchlistContainer.innerHTML = '';

      // Create cards for each watchlist movie
      watchlist.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.className = 'col-md-4 col-lg-3 col-sm-6';
        movieCard.innerHTML = `
          <div class="card h-100">
            <img src="${movie.poster || 'https://via.placeholder.com/300x450?text=' + encodeURIComponent(movie.title)}" 
                class="card-img-top" 
                alt="${movie.title}">
            <div class="card-body">
              <h5 class="card-title">${movie.title}</h5>
              <p class="card-text text-muted">${movie.year || ''}</p>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
              <small class="text-muted">${formatGenres(movie.genres)}</small>
              <button class="btn btn-sm btn-outline-danger remove-watchlist-btn" 
                      data-movie-id="${movie.id}">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;

        watchlistContainer.appendChild(movieCard);
      });

      // Add event listeners to remove buttons
      document.querySelectorAll('.remove-watchlist-btn').forEach(button => {
        button.addEventListener('click', function () {
          const movieId = this.getAttribute('data-movie-id');
          removeFromWatchlist(movieId)
            .then(() => {
              // Reload watchlist after successful removal
              loadWatchlist();
            })
            .catch(error => {
              console.error('Error removing from watchlist:', error);
            });
        });
      });
    }

    // Initialize when the page loads
    document.addEventListener('DOMContentLoaded', function () {
      // Set up demo mode button
      const demoButton = document.getElementById('demo-mode');
      if (demoButton) {
        demoButton.addEventListener('click', showDemoMode);
      }

      // If user is logged in, load watchlist
      if (isLoggedIn()) {
        loadWatchlist();
      }
    });
  </script>
</body>
